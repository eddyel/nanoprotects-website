[build]
  # SUPPRIMER base = "client" - on travaille depuis la racine
  command = "cd client && npm run build && cd .."
  publish = "client/dist"

# Configuration des fonctions Netlify
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirection SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
