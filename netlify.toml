[build]
  # Commande de build depuis la racine (pas de cd client)
  command = "npm run build"
  
  # Dossier de publication = dist/public (tel que configuré dans vite.config.ts)
  publish = "dist/public"

# Configuration des fonctions Netlify
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirection SPA (pour le routing React)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
