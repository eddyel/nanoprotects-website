name: Claude PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        run: |
          git diff --name-only origin/main...HEAD > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Get diff content
        run: |
          git diff origin/main...HEAD -- '*.tsx' '*.ts' '*.jsx' '*.js' '*.css' '*.json' > diff_output.txt
          head -c 15000 diff_output.txt > diff_trimmed.txt

      - name: Review with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request

          api_key = os.environ.get("ANTHROPIC_API_KEY", "")

          with open("changed_files.txt") as f:
              files = f.read()
          with open("diff_trimmed.txt") as f:
              diff = f.read()

          prompt = f"""You are an expert Next.js and React code reviewer. Review the following pull request diff and provide constructive feedback.

          Changed files:
          {files}

          Diff:
          {diff}

          Please review for:
          1. Bugs or logic errors
          2. Performance issues (Next.js specific: missing use client, SSR issues, hooks misuse)
          3. Accessibility concerns
          4. Code style and best practices
          5. Security issues
          6. Suggestions for improvement

          Be specific, constructive, and reference line numbers where relevant. Format your response in clear sections using markdown."""

          payload = json.dumps({
              "model": "claude-sonnet-4-6",
              "max_tokens": 2048,
              "messages": [{"role": "user", "content": prompt}]
          }).encode("utf-8")

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=payload,
              headers={
                  "x-api-key": api_key,
                  "anthropic-version": "2023-06-01",
                  "content-type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read())
                  review = data["content"][0]["text"]
          except Exception as e:
              review = f"Claude could not generate a review: {e}"

          with open("review_output.txt", "w") as f:
              f.write(review)

          print("Review generated successfully.")
          PYEOF

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review_output.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 Claude Code Review\n\n${review}\n\n---\n*Reviewed by Claude Sonnet via GitHub Actions*`
            });
